<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vco — Film</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{
  --org:#ff8a1f; --org2:#ffb454; --cyan:#53e7ff; --lime:#b6ff5c; --red:#ff3b57;
  --text:#eef3fb; --dim:#8fa0b8;
  --sans:'Inter','Noto SC',system-ui,sans-serif;
  --disp:'Space Grotesk','Noto SC',system-ui,sans-serif;
  --mono:'JBMono',ui-monospace,Menlo,Consolas,monospace;
  --cn:'Noto SC','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03040a;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#stage{position:relative;width:1920px;height:1080px;transform-origin:center;flex:none;overflow:hidden;background:#03040a}
#gl2{position:absolute;inset:0;width:1920px;height:1080px;z-index:1}
#ui{position:absolute;inset:0;width:1920px;height:1080px;z-index:5}
.abs{position:absolute}.ctr{left:0;right:0;text-align:center}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:-.03em;line-height:.98;color:var(--text);text-shadow:0 2px 40px rgba(2,4,10,.9),0 0 90px rgba(2,4,10,.6);white-space:nowrap}
.cn{font-family:var(--cn);font-weight:700;color:#d3dcec;letter-spacing:.02em}
.kick{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.42em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:var(--mono)}
.gradO{background:linear-gradient(100deg,#ffd27a,var(--org) 55%,#ff5a1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.gradC{background:linear-gradient(100deg,var(--org2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.org{color:var(--org)}.cyan{color:var(--cyan)}.lime{color:var(--lime)}.red{color:var(--red)}.dim{color:var(--dim)}.amber{color:var(--org2)}
.vig{position:absolute;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse 92% 80% at 50% 50%,transparent 18%,rgba(2,3,8,.55) 55%,rgba(2,3,8,.92) 100%)}
.scan{position:absolute;inset:0;pointer-events:none;z-index:6;mix-blend-mode:overlay;opacity:.5;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
.term{position:absolute;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgb(14,20,30),rgb(8,12,19));border:1px solid rgba(110,120,140,.3);box-shadow:0 50px 120px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
.term .tb{height:48px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid rgba(110,120,140,.2);font:600 18px var(--mono);color:var(--dim)}
.dot{width:13px;height:13px;border-radius:50%}
.term pre{font:500 23px/1.5 var(--mono);padding:24px 28px;white-space:pre;color:#d6e4f6}
.tag{position:absolute;font:600 22px var(--mono);padding:9px 18px;border-radius:999px;border:1px solid;background:rgba(3,4,10,.8);white-space:nowrap}
.chip{position:absolute;border-radius:16px;padding:20px 26px;background:linear-gradient(165deg,rgb(26,22,16),rgb(11,11,15));border:1px solid rgba(255,138,31,.32);box-shadow:0 30px 70px rgba(0,0,0,.5)}
.chip .n{font:700 17px var(--mono);letter-spacing:.22em;color:var(--org)}
.chip h3{font:700 30px/1.05 var(--disp);letter-spacing:-.02em;margin:10px 0 6px;color:var(--text)}
.chip p{font:600 20px/1.35 var(--sans);color:var(--dim)}
.gcell{display:flex;align-items:center;justify-content:center;font:600 22px var(--mono);color:rgba(255,200,140,.55);border:1px solid rgba(255,138,31,.22);background:rgba(20,14,8,.35)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="gl2" width="1920" height="1080"></canvas>
  <div id="ui"></div>
  <div class="scan"></div><div class="vig"></div>
</div></div>

<script type="importmap">
{ "imports": { "three":"./node_modules/three/build/three.module.js", "three/addons/":"./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W=1920,H=1080,DUR=40;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=x=>1-Math.pow(1-clamp(x),3);
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
function rnd(i){const x=Math.sin(i*127.13+311.7)*43758.545;return x-Math.floor(x);}
const SC={s0:[0,4],s1:[4,12],s2:[12,20],s3:[20,27],s4:[27,34],s5:[34,40]};

/* ===== THREE ===== */
const glCanvas=document.createElement('canvas');glCanvas.width=W;glCanvas.height=H;
const renderer=new THREE.WebGLRenderer({canvas:glCanvas,antialias:true,alpha:false,preserveDrawingBuffer:true});
const ctx2=$('gl2').getContext('2d');
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.95;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x03040a,0.012);
const camera=new THREE.PerspectiveCamera(50,W/H,0.1,300);camera.position.set(0,0,52);

// pixel field
const NX=130,NY=74,NP=NX*NY, FW=104,FH=58;
const pos=new Float32Array(NP*3),col=new Float32Array(NP*3),siz=new Float32Array(NP),bx=new Float32Array(NP),by=new Float32Array(NP);
for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const k=j*NX+i;bx[k]=(i/(NX-1)-.5)*FW;by[k]=(j/(NY-1)-.5)*FH;siz[k]=1.1+rnd(k)*0.8;}
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(pos,3));
g.setAttribute('color',new THREE.BufferAttribute(col,3));
g.setAttribute('asize',new THREE.BufferAttribute(siz,1));
const pmat=new THREE.ShaderMaterial({
  uniforms:{uScale:{value:H/3.4}},
  vertexShader:`attribute float asize;attribute vec3 color;varying vec3 vc;uniform float uScale;
    void main(){vc=color;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=asize*uScale/max(-mv.z,1.0);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vc;void main(){vec2 d=gl_PointCoord-0.5;float r=dot(d,d);float a=smoothstep(0.25,0.0,r);if(a<0.01)discard;gl_FragColor=vec4(vc,a);}`,
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(g,pmat));

// floating UI cards
const cards=[];
const cardMat=new THREE.MeshStandardMaterial({color:0x0b0f18,emissive:0x06101a,emissiveIntensity:0.5,metalness:0.6,roughness:0.4});
for(let c=0;c<9;c++){
  const w=5+rnd(c*3.1)*7,h=1.6+rnd(c*5.3)*2.4;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.18),cardMat);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,0.18)),new THREE.LineBasicMaterial({color:0x2bb6d6,transparent:true,opacity:0.32}));
  m.add(e);
  m.userData={x:(rnd(c*7.7)-.5)*70,y:(rnd(c*9.1)-.5)*38,z:-6+rnd(c*2.3)*5,sp:0.15+rnd(c*4.4)*0.25,ph:rnd(c)*6.28};
  scene.add(m);cards.push(m);
}

// reticle
const RET=new THREE.Group();scene.add(RET);
const orgMat=new THREE.MeshBasicMaterial({color:new THREE.Color(0xff8a1f).multiplyScalar(2.3),transparent:true,opacity:1,blending:THREE.AdditiveBlending});
const ringO=new THREE.Mesh(new THREE.TorusGeometry(2.6,0.07,10,80),orgMat);RET.add(ringO);
const ringI=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.045,10,64),orgMat);RET.add(ringI);
for(let k=0;k<4;k++){const tk=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.1,0.05),orgMat);const a=k*Math.PI/2;tk.position.set(Math.sin(a)*3.5,Math.cos(a)*3.5,0);tk.rotation.z=-a;RET.add(tk);}
const dotM=new THREE.Mesh(new THREE.CircleGeometry(0.2,16),orgMat);RET.add(dotM);
const halo=new THREE.Mesh(new THREE.CircleGeometry(4.6,48),new THREE.MeshBasicMaterial({color:0xff8a1f,transparent:true,opacity:0.12,blending:THREE.AdditiveBlending}));RET.add(halo);
// ripples
const ripples=[];
for(let r=0;r<8;r++){const m=new THREE.Mesh(new THREE.TorusGeometry(1,0.05,8,64),new THREE.MeshBasicMaterial({color:new THREE.Color(0x53e7ff).multiplyScalar(2),transparent:true,opacity:0,blending:THREE.AdditiveBlending}));scene.add(m);ripples.push(m);}
const CLICKS=[8.4,11.2,15.6,18.4,24.6,30.2];
const WP=[[0,0,0],[3.4,-12,5],[7.6,12,-5],[10.8,-4,7],[14.4,-20,-7],[17.8,16,8],[21,2,0],[24,-10,-3],[28,18,4],[31,-14,6],[34,0,0],[36,-34,-14],[40,-34,-14]];
function retPos(t){
  let i=0;while(i<WP.length-2&&t>=WP[i+1][0])i++;
  const a=WP[i],b=WP[i+1],u=easeIO((t-a[0])/Math.max(b[0]-a[0],0.001));
  return [lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
}
// lights
const key=new THREE.PointLight(0xffe2c0,160,120);key.position.set(14,16,26);scene.add(key);
const fill=new THREE.PointLight(0x2b7bff,70,120);fill.position.set(-20,-10,12);scene.add(fill);
scene.add(new THREE.AmbientLight(0x1c2230,1.3));

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W/3,H/3),0.7,0.55,0.7));
composer.addPass(new OutputPass());
const tc=new THREE.Color();
const C_BASE=new THREE.Color(0x1d6f88),C_ORG=new THREE.Color(0xff8a1f),C_HI=new THREE.Color(0xdff6ff);

function updateField(t,rx,ry){
  const P=g.attributes.position.array,C=g.attributes.color.array;
  const lockAmt=clamp((t-3)/1.2);
  const sweep=((t*9)%80)-40;
  for(let k=0;k<NP;k++){
    const x=bx[k],y=by[k];
    const dx=x-rx,dy=y-ry,d2=dx*dx+dy*dy;
    const near=Math.exp(-d2/26)*lockAmt;
    const z=-4+Math.sin(x*0.22+t*0.9)*0.9+Math.cos(y*0.3+t*0.7)*0.7+near*2.2;
    P[k*3]=x;P[k*3+1]=y;P[k*3+2]=z;
    const sw=Math.exp(-Math.pow(x-sweep,2)/18)*0.55;
    tc.copy(C_BASE).lerp(C_ORG,Math.min(near*1.2,1)).lerp(C_HI,sw*0.5);
    const br=0.38+near*1.5+sw;
    C[k*3]=tc.r*br;C[k*3+1]=tc.g*br;C[k*3+2]=tc.b*br;
  }
  g.attributes.position.needsUpdate=true;g.attributes.color.needsUpdate=true;
}
function choreo(t){
  const [rx,ry]=retPos(t);
  // nearest lock moment => pulse
  let lockPulse=0;[4.6,8.0,11.0,14.8,18.0,24.2,28.6,31.6].forEach(tl=>{const d=t-tl;if(d>=0&&d<1.2)lockPulse=Math.max(lockPulse,Math.exp(-d*3.2));});
  const vis=clamp((t-3.2)/0.8)*(1-clamp((t-35)/1.2));
  RET.visible=vis>0.01;
  RET.position.set(rx,ry,2.5);
  const sc=(1+lockPulse*0.55)*lerp(1.8,1,ease((t-3.2)/1.0));
  RET.scale.setScalar(Math.max(sc,0.01));
  ringO.rotation.z=t*0.5;ringI.rotation.z=-t*0.9;
  halo.material.opacity=0.10+lockPulse*0.22;
  orgMat.opacity=vis;
  // ripples
  ripples.forEach((m,i)=>{const tc0=CLICKS[i];if(tc0==null){m.visible=false;return;}
    const d=t-tc0;if(d<0||d>1.0){m.visible=false;return;}m.visible=true;
    const [px,py]=retPos(tc0);m.position.set(px,py,2.6);m.scale.setScalar(1+d*7.5);m.material.opacity=(1-d)*0.9;});
  // cards drift
  cards.forEach((m,i)=>{const u=m.userData;m.position.set(u.x+Math.sin(t*u.sp+u.ph)*2.2,u.y+Math.cos(t*u.sp*0.8+u.ph)*1.4,u.z+Math.sin(t*0.3+u.ph)*0.8);
    m.rotation.y=Math.sin(t*u.sp+u.ph)*0.25;m.rotation.x=Math.cos(t*u.sp*0.7+u.ph)*0.12;
    const d=Math.hypot(m.position.x-rx,m.position.y-ry);cardMat.emissiveIntensity=0.8;
  });
  updateField(t,rx,ry);
}
function cam(t){
  let px=0,py=0,pz=52;
  const u=t/DUR;
  pz=lerp(58,40,easeIO(clamp(t/6)))-Math.sin(t*0.12)*3;
  px=Math.sin(t*0.16)*5;py=Math.cos(t*0.13)*2.5+1;
  if(t>34){const e=easeIO((t-34)/6);pz=lerp(pz,34,e);px*=1-e;py*=1-e;}
  camera.position.set(px,py,pz);camera.lookAt(0,0,0);
}

/* ===== OVERLAY (fresh DOM each frame) ===== */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const op=(l,r,out)=>clamp((l-r)/0.55)*(out!=null?1-clamp((l-out)/0.45):1);
const S=(l,r,out,dy=26)=>`opacity:${op(l,r,out).toFixed(3)};transform:translateY(${((1-ease((l-r)/0.6))*dy).toFixed(1)}px)`;
function slam(l,r,txt,style){const on=l>=r;const p=clamp((l-r)/0.13);
  const sh=on&&l-r<0.3?(rnd(Math.floor(l*60)+r*7)-0.5)*22*(1-(l-r)/0.3):0;
  return `<div class="abs ctr disp" style="${style};opacity:${on?1:0};transform:scale(${(1+(1-ease(p))*0.4).toFixed(3)}) translateX(${sh.toFixed(1)}px)">${txt}</div>`;}
const scW=(t,a,b)=>({l:(t>=a&&t<b)?t-a:-1,o:clamp((t-a)/0.4)*(1-clamp((t-(b-0.4))/0.4))});
function termBox(x,tb,inner,st){return `<div class="term" style="${x}">${tb?`<div class="tb">${tb}</div>`:''}<pre style="${st||''}">${inner}</pre></div>`;}
const wrapS=(l,o,b)=>`<div class="abs" style="inset:0;opacity:${o.toFixed(3)}">${b}</div>`;
const typedS=(s,l,t0,cps)=>s.slice(0,Math.floor(clamp((l-t0)*cps,0,1e9)));
let FLASH=0;
function sceneHTML(t){
  FLASH=0;let H='';
  // S0 HOOK
  {const {l,o}=scW(t,...SC.s0);
   if(l>=0){let b='';
    b+=`<div class="abs ctr kick" style="top:240px;${S(l,0.1,null,18)}">LLM + SHELL · 大模型 + 终端</div>`;
    b+=slam(l,0.6,'YOUR LLM','top:310px;font-size:190px');
    b+=slam(l,1.3,`CAN'T <span class="gradO">CLICK.</span>`,'top:510px;font-size:210px');
    b+=`<div class="abs ctr cn" style="top:780px;font-size:48px;${S(l,2.2)}">它能读、能想、能写 —— <span class="org">但点不下去。</span></div>`;
    b+=`<div class="abs ctr mono" style="top:880px;font-size:30px;letter-spacing:.3em;color:var(--org);${S(l,3.0)}">UNTIL NOW.</div>`;
    [0.6,1.3].forEach(h=>{if(l>=h&&l-h<0.2)FLASH=Math.max(FLASH,0.45*(1-(l-h)/0.2));});
    H+=wrapS(l,o,b);}}
  // S1 OCR FIND
  {const {l,o}=scW(t,...SC.s1);
   if(l>=0){let b='';
    const cmd='$ vco find --target "Sign in"';
    let r;
    if(l<0.9)r='<span class="org">'+esc(typedS(cmd,l,0.2,40))+'</span>▋';
    else{r='<span class="org">'+esc(cmd)+'</span>\n';
      const J=['{','  "found": <span class="lime">true</span>,','  "x": <span class="cyan">1164</span>, "y": <span class="cyan">92</span>,','  "method": <span class="org">"ocr"</span>,','  "marked_image": ".screenshot/…"','}'];
      const n=Math.floor(clamp((l-1.2)*7,0,J.length));r+=J.slice(0,n).join('\n');}
    b+=`<div class="abs kick" style="left:120px;top:96px">DESKTOP · OCR FIRST · 桌面通道:OCR 优先</div>`;
    b+=termBox('left:120px;top:170px;width:820px;height:420px','<i class="dot" style="background:#ff5f56"></i><i class="dot" style="background:#ffbd2e"></i><i class="dot" style="background:#27c93f"></i>&nbsp;terminal',r,'font-size:26px;line-height:1.55');
    b+=`<div class="tag" style="left:1000px;top:230px;color:var(--lime);border-color:var(--lime);${S(l,3.2)}">unique OCR hit → 0 model calls</div>`;
    b+=`<div class="tag" style="left:1000px;top:300px;color:var(--org);border-color:var(--org);${S(l,3.9)}">coordinates computed locally</div>`;
    b+=`<div class="tag" style="left:1000px;top:370px;color:var(--cyan);border-color:var(--cyan);${S(l,4.6)}">dry-run: draws a red circle · never moves the mouse</div>`;
    b+=`<div class="abs ctr disp" style="top:760px;font-size:96px;${S(l,5.0,null,0)}">OCR finds it. <span class="gradO">Zero model calls.</span></div>`;
    b+=`<div class="abs ctr cn" style="top:900px;font-size:42px;${S(l,5.8)}">文字唯一命中,坐标本地算,零模型调用。</div>`;
    H+=wrapS(l,o,b);}}
  // S2 WEB
  {const {l,o}=scW(t,...SC.s2);
   if(l>=0){let b='';
    const c1='$ vco webtext https://example.com';
    const y=['- heading "Example Domain" [level=1]','- paragraph: This domain is for use in…','- link "More information…"'];
    let L='<span class="org">'+esc(typedS(c1,l,0.2,42))+'</span>';
    if(l>1.4){L='<span class="org">'+esc(c1)+'</span>\n<span class="dim"># accessibility tree · roles + text as YAML</span>\n';const n=Math.floor(clamp((l-1.8)*3,0,y.length));L+=y.slice(0,n).map(x=>'<span class="cyan">'+esc(x)+'</span>').join('\n');}
    b+=`<div class="abs kick" style="left:100px;top:76px">WEB · DOM, NOT PIXELS · 网页通道:读 DOM,不看像素</div>`;
    b+=termBox('left:100px;top:150px;width:880px;height:330px','<i class="dot" style="background:#ff5f56"></i><i class="dot" style="background:#ffbd2e"></i><i class="dot" style="background:#27c93f"></i>&nbsp;perceive',L,'font-size:23px');
    const c2='$ vco webclick http://127.0.0.1:9005 \\\n    --fill 输入消息=你好 --target 发送';
    let R='<span class="org">'+esc(typedS(c2,l,3.6,46))+'</span>';
    b+=termBox('right:100px;top:150px;width:780px;height:330px','<i class="dot" style="background:#ff5f56"></i><i class="dot" style="background:#ffbd2e"></i><i class="dot" style="background:#27c93f"></i>&nbsp;act',R,'font-size:23px');
    const C=[['AMBIGUOUS?','Refused & listed','Never guesses which button.'],['VERIFY','--expect "text"','Waits for post-click content.'],['SEE IT','--headed --record','Orange halo · .webm video.'],['LOGIN','--profile <dir>','Persists cookies & sign-in.']];
    C.forEach((c,i)=>{b+=`<div class="chip" style="left:${100+i*455}px;top:540px;width:420px;${S(l,5.0+i*0.35)}"><div class="n">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`;});
    b+=`<div class="abs ctr disp" style="top:800px;font-size:92px;${S(l,6.4,null,0)}">No vision model. <span class="gradO">Not one.</span></div>`;
    b+=`<div class="abs ctr cn" style="top:930px;font-size:42px;${S(l,7.0)}">网页:全程零视觉模型,文本模型也能「看见」。</div>`;
    H+=wrapS(l,o,b);}}
  // S3 GRID FALLBACK
  {const {l,o}=scW(t,...SC.s3);
   if(l>=0){let b='';
    b+=`<div class="abs kick" style="left:100px;top:76px">NO TEXT ON TARGET? · 目标没有文字?</div>`;
    // numbered grid 8x5
    let cells='';for(let i=0;i<40;i++){const hit=(i===18)&&l>3.2;cells+=`<div class="gcell" style="${hit?'background:rgba(255,138,31,.42);color:#fff;border-color:#ff8a1f;box-shadow:0 0 40px rgba(255,138,31,.6) inset':''}">${i+1}</div>`;}
    const ga=op(l,0.3);
    b+=`<div class="abs" style="left:100px;top:150px;width:960px;height:540px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);opacity:${ga.toFixed(3)}">${cells}</div>`;
    if(l>3.2)b+=`<div class="tag" style="left:560px;top:430px;color:var(--org);border-color:var(--org);${S(l,3.2)}">vision model picks cell 19</div>`;
    const steps=[['01','shot','see the current state'],['02','find --target','locate + circled image'],['03','click --at','real click, after you look'],['04','shot','verify the UI changed']];
    steps.forEach((s,i)=>{b+=`<div class="chip" style="left:1130px;top:${150+i*135}px;width:690px;padding:16px 24px;${S(l,0.8+i*0.5)}"><div class="n">${s[0]}</div><h3 style="font-size:28px">$ vco ${s[1]}</h3><p style="font-size:18px">${s[2]}</p></div>`;});
    b+=`<div class="abs ctr disp" style="top:760px;font-size:92px;${S(l,4.4,null,0)}">Vision is the <span class="gradO">fallback.</span></div>`;
    b+=`<div class="abs ctr cn" style="top:890px;font-size:42px;${S(l,5.1)}">视觉模型只兜底;坐标换算和真实鼠标由本地程序负责。</div>`;
    H+=wrapS(l,o,b);}}
  // S4 WEBDEBUG
  {const {l,o}=scW(t,...SC.s4);
   if(l>=0){let b='';
    const c='$ vco webdebug http://127.0.0.1:8772/ \\\n    --task "…hit Refresh, and the list jumped back to the top"';

      const J=['{','  "reproduced": <span class="lime">true</span>,','  "culprit": <span class="org">"HTMLButtonElement.rebuildList (…:25:19)"</span>,','  "how": "assigned",','  "assignments": [{"from": <span class="cyan">1820</span>, "to": <span class="cyan">0</span>}],','  "user_actions": ["click Refresh list"]','}'];
      const n=Math.floor(clamp((l-2.0)*5,0,J.length));r+=J.slice(0,n).join('\n');}
    b+=`<div class="abs kick" style="left:100px;top:76px">FRONT-END DEBUGGER · 前端调试器</div>`;
    b+=termBox('left:100px;top:150px;width:1180px;height:520px','<i class="dot" style="background:#ff5f56"></i><i class="dot" style="background:#ffbd2e"></i><i class="dot" style="background:#27c93f"></i>&nbsp;webdebug',r,'font-size:24px;line-height:1.5');
    const M=[['01','measure','the value the complaint is about'],['02','arm','recorders before touching anything'],['03','act','real clicks, real wheel, real typing'],['04','report','never edits your code']];
    M.forEach((m,i)=>{b+=`<div class="chip" style="left:1330px;top:${150+i*132}px;width:490px;padding:14px 22px;${S(l,0.9+i*0.45)}"><div class="n">${m[0]}</div><h3 style="font-size:26px">${m[1]}</h3><p style="font-size:17px">${m[2]}</p></div>`;});
    b+=`<div class="abs ctr disp" style="top:740px;font-size:74px;${S(l,4.2,null,0)}">Evidence in. <span class="gradO">Culprit out.</span></div>`;
    b+=`<div class="abs ctr cn" style="top:855px;font-size:40px;${S(l,4.9)}">结论只来自录到的证据,不来自模型的自述。</div>`;
    b+=`<div class="abs ctr mono" style="top:935px;font-size:24px;color:var(--dim);${S(l,5.5)}">an unproven cause cannot appear in the report</div>`;
    H+=wrapS(l,o,b);}}
  // S5 OUTRO
  {const {l,o}=scW(t,...SC.s5);
   if(l>=0){let b='';
    b+=`<div class="abs ctr disp" style="top:250px;font-size:290px;${S(l,0.3,null,18)}"><span class="gradO">vco</span></div>`;

    b+=`<div class="abs ctr" style="top:780px;${S(l,2.5)}"><span style="font:600 32px var(--mono);padding:16px 32px;border:1px solid rgba(255,138,31,.45);border-radius:14px;background:rgba(14,12,10,.75);color:var(--org)">$ pip install 'vco[control,ocr,browser]'</span></div>`;

    b+=`<div class="abs ctr mono" style="top:975px;font-size:28px;letter-spacing:.3em;color:var(--dim);${S(l,3.8)}">BUILT BY <span class="org">@lo2589</span></div>`;
    H+=wrapS(l,o,b);}}
  // brand
  const bo=(t>1.0&&t<SC.s5[0]+0.3)?0.92:0;
  if(bo>0)H+=`<div class="abs" style="right:52px;top:34px;display:flex;align-items:center;gap:13px;opacity:${bo}"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="#ff8a1f" stroke-width="3.2" stroke-linecap="round"><circle cx="24" cy="24" r="14"/><circle cx="24" cy="24" r="4" fill="#ff8a1f"/><path d="M24 3v9M24 36v9M3 24h9M36 24h9"/></svg><div><div style="font:700 25px var(--disp);color:#eef3fb;line-height:1">vco</div><div style="font:600 17px var(--mono);color:#ff8a1f;line-height:1.3">@lo2589</div></div></div>`;
  if(FLASH>0.01)H+=`<div class="abs" style="inset:0;background:#fff4e0;opacity:${FLASH.toFixed(3)};mix-blend-mode:screen"></div>`;
  return H;
}
window.sceneHTML=sceneHTML;

function renderGL(t){t=clamp(t,0,DUR-0.001);choreo(t);cam(t);composer.render();ctx2.clearRect(0,0,W,H);ctx2.drawImage(glCanvas,0,0,W,H);}
function domFresh(t){t=clamp(t,0,DUR-0.001);document.querySelectorAll('.ovframe').forEach(e=>e.remove());const d=document.createElement('div');d.className='ovframe';d.style.cssText='position:absolute;inset:0;z-index:5';d.innerHTML=sceneHTML(t);$('ui').appendChild(d);}
window.__gl=renderGL;window.__domFresh=domFresh;window.__ready=true;

// live preview
let t=0,last=0,playing=false;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('stage').style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
function loop(ts){if(playing){t+=(ts-last)/1000;if(t>=DUR)t=0;}last=ts;if(playing){renderGL(t);domFresh(t);}requestAnimationFrame(loop);}
addEventListener('keydown',e=>{if(e.code==='Space'){playing=!playing;}});
const q=new URLSearchParams(location.search);
if(q.has('autoplay'))playing=true;
requestAnimationFrame(ts=>{last=ts;loop(ts);});
</script>
