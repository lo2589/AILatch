<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03040a;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}

#gl2{position:absolute;inset:0;width:1920px;height:1080px;z-index:1}
#ui{position:absolute;inset:0;width:1920px;height:1080px;z-index:5}

.gradR{background:linear-gradient(100deg,#ff7a5c,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.red{color:var(--red)}.lime{color:var(--lime)}.cyan{color:var(--cyan)}.amber{color:var(--amber)}.dim{color:var(--dim)}

#hud{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(transparent,rgba(0,0,0,.8));font:600 12px var(--mono);color:#9fb0c7;opacity:0;transition:.2s;z-index:20}
#wrap:hover #hud,body.paused #hud{opacity:1}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const LOCK = window.__LOCK__ || {size:645,head:[],ct:[],catHead:'',catCt:''};
const W=1920,H=1080, DUR=54;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
const ease=x=>1-Math.pow(1-clamp(x),3);
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
function rnd(i){const x=Math.sin(i*127.13+311.7)*43758.545;return x-Math.floor(x);}

// scene windows [start,end]
const SC={s0:[0,5],s1:[5,14],s2:[14,19],s3:[19,28],s4:[28,36],s5:[36,43.5],s6:[43.5,54]};

/* ================= THREE SETUP ================= */
const glCanvas=document.createElement('canvas');glCanvas.width=W;glCanvas.height=H;
const renderer=new THREE.WebGLRenderer({canvas:glCanvas,antialias:true,alpha:false,preserveDrawingBuffer:true});
const ctx2=$('gl2').getContext('2d');
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.92;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x03040a,0.016);
const camera=new THREE.PerspectiveCamera(52,W/H,0.1,400);
camera.position.set(0,0,48);

// ---- CODE RIVER (points) ----
const LINES=1500, PERLINE=16, NP=LINES*PERLINE;
const pos=new Float32Array(NP*3), col=new Float32Array(NP*3), siz=new Float32Array(NP);
const base=new Float32Array(NP*3), lineSpeed=new Float32Array(LINES), lineSecret=new Uint8Array(LINES), charBright=new Float32Array(NP);
const Zmin=-150, Zmax=18, span=Zmax-Zmin;
for(let l=0;l<LINES;l++){
  const lx=(rnd(l*2.1)-0.5)*70, ly=(rnd(l*3.3+1)-0.5)*44, lz=Zmin+rnd(l*1.7+5)*span;
  const len=0.5+rnd(l*5.1)*1.1; lineSpeed[l]=6+rnd(l*7.7)*9;
  lineSecret[l]= rnd(l*9.3+2)<0.07 ?1:0;
  for(let p=0;p<PERLINE;p++){
    const i=l*PERLINE+p, k=i*3;
    base[k]=lx+p*len; base[k+1]=ly; base[k+2]=lz;
    charBright[i]=0.35+rnd(i*4.4)*0.65;
    siz[i]=(rnd(i*2.2)<0.5?1.0:1.7)* (lineSecret[l]?1.5:1);
  }
}
pos.set(base);
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(pos,3));
g.setAttribute('color',new THREE.BufferAttribute(col,3));
g.setAttribute('asize',new THREE.BufferAttribute(siz,1));
const pmat=new THREE.ShaderMaterial({
  uniforms:{uScale:{value:H/3.6}},
  vertexShader:`attribute float asize;attribute vec3 color;varying vec3 vc;uniform float uScale;
    void main(){vc=color;vec4 mv=modelViewMatrix*vec4(position,1.0);
    gl_PointSize=asize*uScale/max(-mv.z,1.0);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vc;void main(){vec2 d=gl_PointCoord-0.5;float r=dot(d,d);
    float a=smoothstep(0.25,0.0,r);if(a<0.01)discard;gl_FragColor=vec4(vc,a);}`,
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false
});
const river=new THREE.Points(g,pmat);scene.add(river);

// ---- AI CORE ----
const coreG=new THREE.IcosahedronGeometry(5,2);
const coreMat=new THREE.MeshStandardMaterial({color:0x0a0c14,emissive:0xff2a44,emissiveIntensity:0.6,metalness:0.9,roughness:0.25,flatShading:true});
const core=new THREE.Mesh(coreG,coreMat);core.position.set(0,0,-6);scene.add(core);
const coreWire=new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(5.25,1)),new THREE.LineBasicMaterial({color:0xff3b57,transparent:true,opacity:0.5}));
core.add(coreWire);
const halo=new THREE.Mesh(new THREE.SphereGeometry(7.4,32,32),new THREE.MeshBasicMaterial({color:0xff3b57,transparent:true,opacity:0.0,side:THREE.BackSide,blending:THREE.AdditiveBlending}));
core.add(halo);

// ---- LOCK (hidden until S2) ----
const lock=new THREE.Group();lock.position.set(0,0,-6);lock.visible=false;scene.add(lock);
const bodyMat=new THREE.MeshStandardMaterial({color:0x0c1018,emissive:0x3a8f28,emissiveIntensity:1.2,metalness:0.85,roughness:0.28,flatShading:false});
const body=new THREE.Mesh(new THREE.BoxGeometry(7.2,5.6,3.2),bodyMat);
// round-ish: scale a bit
body.geometry.translate(0,-0.4,0);
lock.add(body);
const shackleMat=new THREE.MeshStandardMaterial({color:0x0c1018,emissive:0x1f7a84,emissiveIntensity:1.0,metalness:0.9,roughness:0.22});
const shackle=new THREE.Mesh(new THREE.TorusGeometry(2.4,0.62,20,40,Math.PI),shackleMat);
shackle.position.set(0,3.0,0);lock.add(shackle);
const sl=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,2.2,20),shackleMat);sl.position.set(-2.4,1.9,0);lock.add(sl);
const sr=sl.clone();sr.position.x=2.4;lock.add(sr);
const keyG=new THREE.Mesh(new THREE.CircleGeometry(0.72,24),new THREE.MeshBasicMaterial({color:0x03040a}));keyG.position.set(0,-0.2,1.61);lock.add(keyG);
const lockEdges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(7.2,5.6,3.2)),new THREE.LineBasicMaterial({color:0x8affc0,transparent:true,opacity:0.6}));
lockEdges.position.y=-0.4;lock.add(lockEdges);
const lockHalo=new THREE.Mesh(new THREE.SphereGeometry(8.5,24,24),new THREE.MeshBasicMaterial({color:0x6effb0,transparent:true,opacity:0.0,side:THREE.BackSide,blending:THREE.AdditiveBlending}));
lock.add(lockHalo);

// ---- SHIELD ring ----
const shield=new THREE.Mesh(new THREE.TorusGeometry(11,0.14,12,96),new THREE.MeshBasicMaterial({color:0x6effb0,transparent:true,opacity:0,blending:THREE.AdditiveBlending}));
shield.position.set(0,0,-6);scene.add(shield);

// lights
const key=new THREE.PointLight(0xffffff,180,120);key.position.set(14,16,24);scene.add(key);
const fill=new THREE.PointLight(0x4e7bff,90,120);fill.position.set(-18,-10,10);scene.add(fill);
scene.add(new THREE.AmbientLight(0x202838,1.4));

// ---- postfx ----
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W/2,H/2),0.62,0.5,0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// color palettes for particles
const C_READ=new THREE.Color(0x66b8ff), C_WHITE=new THREE.Color(0xdff0ff), C_RED=new THREE.Color(0xff3b57), C_LIME=new THREE.Color(0xb6ff5c), C_CY=new THREE.Color(0x53e7ff);
const tmpC=new THREE.Color();

function updateRiver(t){
  // phase: 0 readable(cyan) danger .. after lock -> scrambled lime
  const lockT=SC.s2[0]+1.4;            // moment code scrambles
  const scr=clamp((t-lockT)/2.2);      // 0..1 scramble progress
  const fl1=Math.floor(t*10);
  const P=g.attributes.position.array, C=g.attributes.color.array;
  // overall flow speed: fast in danger, calm after
  const danger= t<lockT;
  for(let l=0;l<LINES;l++){
    const spd=lineSpeed[l]*(danger?1.0:0.4);
    for(let p=0;p<PERLINE;p++){
      const i=l*PERLINE+p,k=i*3;
      let z=base[k+2]+t*spd;
      z=((z-Zmin)%span+span)%span+Zmin;
      // pull toward core in danger as they near front
      const near=clamp((z-( -40))/58);     // 0 far .. 1 near front
      const pull= danger? near*near*0.30 : 0;
      let x=base[k]*(1-pull*0.6), y=base[k+1]*(1-pull*0.25);
      // scramble jitter
      if(scr>0){const j=scr*1.1;x+=(rnd(i*3.1+fl1)-0.5)*j;y+=(rnd(i*5.7+fl1+9)-0.5)*j;}
      P[k]=x;P[k+1]=y;P[k+2]=z;
      // color
      let br=charBright[i];
      if(lineSecret[l]&&danger){tmpC.copy(C_RED);br*=0.9+0.25*Math.sin(t*9+l);}
      else if(scr<=0){ tmpC.copy(C_READ).lerp(C_WHITE, br*0.4); if(danger)tmpC.lerp(C_RED,0.12);}
      else{ tmpC.copy(C_LIME).lerp(C_CY, 0.3+0.4*rnd(i)); }
      const dim=(0.10+0.90*clamp((z+70)/90))*0.6; // fade in from depth
      C[k]=tmpC.r*br*dim;C[k+1]=tmpC.g*br*dim;C[k+2]=tmpC.b*br*dim;
    }
  }
  g.attributes.position.needsUpdate=true;g.attributes.color.needsUpdate=true;
}

/* ============ CAMERA + OBJECT CHOREO ============ */
function cam(t){
  // keyframed dolly; mostly looking at origin-ish
  let px=0,py=0,pz=48, lx=0,ly=0,lz=-6;
  if(t<5){const u=easeIO(t/5);pz=lerp(70,40,u);py=lerp(6,0,u);px=lerp(-8,0,u)*0.4;}
  else if(t<14){const u=easeIO((t-5)/9);pz=lerp(40,34,u);px=Math.sin(t*0.18)*5;py=Math.sin(t*0.14)*3+1;}
  else if(t<19){const u=easeIO((t-14)/5);pz=lerp(34,30,u);px=lerp(Math.sin(14*0.18)*5,0,u);py=lerp(4,0,u);}
  else if(t<28){const u=easeIO((t-19)/9);pz=lerp(30,33,u);px=Math.sin(t*0.12)*4;py=1;}
  else if(t<36){const u=easeIO((t-28)/8);pz=lerp(33,31,u);px=lerp(Math.sin(28*.12)*4,0,u);py=lerp(1,0,u);}
  else if(t<43.5){const u=easeIO((t-36)/7.5);pz=lerp(31,36,u);py=Math.sin(t*0.1)*2;px=Math.sin(t*0.1)*3;}
  else {const u=easeIO((t-43.5)/10);pz=lerp(36,30,u);px=lerp(Math.sin(43.5*.1)*3,0,u);py=0;}
  camera.position.set(px,py,pz);camera.lookAt(lx,ly,lz);
}

function choreo(t){
  // core
  core.rotation.y=t*0.25;core.rotation.x=Math.sin(t*0.3)*0.2;
  const pulse=1+0.08*Math.sin(t*(t<14?6:2));
  const coreVis = t<SC.s2[0]+0.8;
  core.visible=coreVis;
  core.scale.setScalar(pulse*(t<5?lerp(0.2,1,ease(t/3)):1));
  halo.material.opacity = t<14? 0.12+0.1*Math.sin(t*5):0.08;
  coreMat.emissiveIntensity = 0.6+0.4*Math.sin(t*5);
  // lock assemble S2
  const l0=SC.s2[0];
  lock.visible = t>=l0+0.1;
  if(lock.visible){
    const a=ease((t-l0-0.1)/1.1);
    lock.scale.setScalar(lerp(0.2,1,a));
    shackle.position.y=lerp(7,3.0,ease((t-l0-0.3)/0.9));
    sl.position.y=sr.position.y=lerp(5.9,1.9,ease((t-l0-0.3)/0.9));
    lock.rotation.y=Math.sin(t*0.4)*0.25 + (t>SC.s6[0]? (t-SC.s6[0])*0.3:0);
    lock.rotation.x=Math.sin(t*0.3)*0.08;
    const g2=clamp((t-l0-1.0)/1.0);
    lockHalo.material.opacity=0.10+0.06*Math.sin(t*3)+g2*0.08;
    bodyMat.emissiveIntensity=0.7+0.3*Math.sin(t*3);
    // outro bigger glow
    if(t>SC.s6[0]){const o=ease((t-SC.s6[0])/2);lock.scale.setScalar(lerp(1,1.3,o));lockHalo.material.opacity=0.18+0.06*Math.sin(t*2);lock.position.y=lerp(0,2.5,o);}
  }
  // shield flare during transform
  const sh=clamp((t-(SC.s3[0]-0.5))/0.6)*(1-clamp((t-SC.s3[0]-3)/1.5));
  shield.material.opacity=sh*0.8;shield.scale.setScalar(lerp(0.6,1.25,ease((t-(SC.s3[0]-0.5))/1.2)));
  shield.rotation.z=t*0.3;
  // fog/scene tint
  const dangerAmt = t<SC.s2[0]+1.2?1:0;
  scene.fog.color.setHex(dangerAmt?0x0a0306:0x03060a);
  key.color.setHex(dangerAmt?0xffdede:0xffffff);
}

/* ================ UI OVERLAY ================ */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const SECRETS=['AWS_SECRET_ACCESS_KEY','sk-live-9f3a77c1e2d8','postgres://admin:hunter2@prod','-----BEGIN RSA PRIVATE KEY','STRIPE_SECRET=sk_live_51H','JWT_SECRET="s3cr3t-prod"','.env DATABASE_PASSWORD','GITHUB_TOKEN=ghp_9aF…','id_rsa (ssh key)','pricing margin 0.8731'];
// fade helpers producing inline style (baked each frame -> fresh nodes raster correctly)
const op=(l,r,out)=>clamp((l-r)/0.55)*(out!=null?1-clamp((l-out)/0.45):1);
const tyv=(l,r,dy=26)=>(1-ease((l-r)/0.6))*dy;
const S=(l,r,out,dy=26)=>`opacity:${op(l,r,out).toFixed(3)};transform:translateY(${tyv(l,r,dy).toFixed(1)}px)`;
function slam(l,r,txt,style){const on=l>=r;const p=clamp((l-r)/0.13);const o=on?1:0;
  const sh=on&&l-r<0.3?(rnd(Math.floor(l*60)+r*7)-0.5)*22*(1-(l-r)/0.3):0;
  return `<div class="abs ctr disp" style="${style};opacity:${o};transform:scale(${(1+(1-ease(p))*0.4).toFixed(3)}) translateX(${sh.toFixed(1)}px)">${txt}</div>`;}
const scW=(t,a,b)=>({l:(t>=a&&t<b)?t-a:-1, o:clamp((t-a)/0.4)*(1-clamp((t-(b-0.4))/0.4))});


// ---- agent transcript (deterministic) ----
const AG_DIRS=['src','lib','api','core','auth','billing','infra','models','services','utils','config','deploy'];
const AG_FILES=['client.py','handler.py','routes.py','session.py','models.py','worker.py','cache.py','db.py','schema.sql','server.js','index.ts','main.go','utils.py','queue.py'];
const AG_SECRET=[['.env','DATABASE_PASSWORD'],['config/secrets.yaml','STRIPE_SECRET'],['~/.ssh/id_rsa','SSH PRIVATE KEY'],['billing/keys.py','API_KEY  sk-live-…'],['infra/deploy.sh','AWS_SECRET_ACCESS_KEY'],['credentials.json','service-account key'],['src/pricing.py','pricing algorithm']];
function agLine(i){
  const sec=i>2&&rnd(i*3.7+1)<0.15;
  const tsec=14*3600+2*60+7+Math.floor(i/5);
  const p2=n=>String(n).padStart(2,'0');
  const ts=p2(Math.floor(tsec/3600))+':'+p2(Math.floor(tsec/60)%60)+':'+p2(tsec%60);
